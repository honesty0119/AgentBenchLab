[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbench-lab"
version = "0.1.0"
description = "Reproducible evaluation, diagnosis and regression testing for document agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "python-dotenv>=1,<2", "tzdata>=2025.1",
  "inspect-ai>=0.3.100,<0.4", "filelock>=3.16,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
agentbench = "agentbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "agentbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app", "tests/test_context.py", "tests/test_runtime.py", "tests/test_tools.py", "tests/helpers.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
