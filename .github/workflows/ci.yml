name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.8'
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: node --check agentbench/static/app.js
      - name: Inspect integration and regression gate
        run: uv run python scripts/ci_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-evidence-${{ matrix.os }}
          path: artifacts/ci
  openjudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.8'
          enable-cache: true
      - run: uv sync --locked --python 3.12 --extra openjudge
      - run: uv run --extra openjudge pytest tests/test_openjudge.py -q
